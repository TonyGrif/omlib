[project]
name = "omlib"
version = "0.1.0"
description = "Python-based Open-Meteo API library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "poethepoet>=0.44.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poe.tasks]
test = "pytest --cov-report term-missing"

_format = "ruff format ."
_clean = "ruff check --fix ."
format.sequence = ["_format", "_clean"]

_type = "mypy ."
_check = "ruff check ."
lint.sequence = ["_type", "_check"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omlib"]
